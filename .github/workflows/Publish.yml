name: Publish

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths-ignore:
      - '**/**.md'
      - '.github/**'
    tags: [ 'v*' ]

jobs:
  build-test:
    name: Build and test
    runs-on: windows-latest

    steps:
    - name: Checkout source code
      uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Build and test
      shell: pwsh
      run: |
        Set-Location "$env:GITHUB_WORKSPACE"

        dotnet restore

        dotnet build ConsoleWhisper.sln -c Release --no-restore

        dotnet test ConsoleWhisper.sln -c Release --no-build

  publish:
    name: Publish the app
    # Releases are cut from version tags only (v<version>, matching <Version> in the csproj);
    # a plain master push runs the gate above and stops there.
    needs: build-test
    if: github.ref_type == 'tag'
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout source code
      uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Check the tag against the project version
      shell: pwsh
      run: |
        $tag = $env:GITHUB_REF_NAME
        if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
          throw "Tag '$tag' is not of the form v<major>.<minor>.<patch>"
        }

        $version = $tag.Substring(1)
        $declared = (dotnet msbuild ConsoleWhisper/ConsoleWhisper.csproj -getProperty:Version).Trim()
        if ($declared -ne $version) {
          throw "Tag '$tag' does not match <Version>$declared</Version> in ConsoleWhisper.csproj"
        }

        Write-Host "Tag $tag matches version $version."

    - name: Publish
      shell: pwsh
      run: |
        Set-Location "$env:GITHUB_WORKSPACE"

        # A missing or half-published package must fail this step: a green job that silently ships a
        # release without its GPU packages would be worse than a red one.
        $ErrorActionPreference = "Stop"
        $PSNativeCommandUseErrorActionPreference = $true
        
        dotnet restore
        
        dotnet publish ConsoleWhisper/ConsoleWhisper.csproj -c Release -r linux-x64 -p:PublishDir="$env:GITHUB_WORKSPACE\Release\linux-x64"
        dotnet publish ConsoleWhisper/ConsoleWhisper.csproj -c Release -r win-x64 -p:PublishDir="$env:GITHUB_WORKSPACE\Release\win-x64"
        dotnet publish ConsoleWhisper/ConsoleWhisper.csproj -c Release -r osx-x64 -p:PublishDir="$env:GITHUB_WORKSPACE\Release\osx-x64"

        dotnet publish ConsoleWhisper/ConsoleWhisper.csproj -c Release -r win-x64 -p:GpuSupport=true -p:PublishDir="$env:GITHUB_WORKSPACE\Release\win-x64-gpu"
        dotnet publish ConsoleWhisper/ConsoleWhisper.csproj -c Release -r linux-x64 -p:GpuSupport=true -p:PublishDir="$env:GITHUB_WORKSPACE\Release\linux-x64-gpu"
        
        Compress-Archive -Path "$env:GITHUB_WORKSPACE\Release\win-x64\" -DestinationPath "CW-win-x64.zip"
        Compress-Archive -Path "$env:GITHUB_WORKSPACE\Release\linux-x64\" -DestinationPath "CW-linux-x64.zip"
        Compress-Archive -Path "$env:GITHUB_WORKSPACE\Release\osx-x64\" -DestinationPath "CW-osx-x64.zip"
        # The GPU packages (pruned to their own RID) are the only per-platform pair with more than
        # one artifact, so drive both of them from a single list instead of repeating the names.
        $gpuRids = @("win-x64-gpu", "linux-x64-gpu")

        foreach ($rid in $gpuRids) {
          Compress-Archive -Path "$env:GITHUB_WORKSPACE\Release\$rid\" -DestinationPath "CW-$rid.zip"
        }

        # Print size, root files and natives of every GPU package, so a broken pruning step, a stray
        # foreign file or a suddenly huge package is visible right in the CI log.
        foreach ($rid in $gpuRids) {
          Write-Host "--- $rid ---"
          Write-Host ("  package: {0} MB" -f [math]::Round((Get-Item "CW-$rid.zip").Length / 1MB, 1))
          Get-ChildItem -File "$env:GITHUB_WORKSPACE\Release\$rid" | ForEach-Object {
            Write-Host ("  root: {0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB))
          }
          Get-ChildItem -Recurse -File "$env:GITHUB_WORKSPACE\Release\$rid\runtimes" | ForEach-Object {
            Write-Host ("  native: {0}  {1:N1} MB" -f $_.FullName.Substring("$env:GITHUB_WORKSPACE\Release\$rid\".Length), ($_.Length / 1MB))
          }
        }

        # Five packages are expected; anything else means a publish or compression step above was lost.
        $packages = @(Get-ChildItem "*.zip")
        if ($packages.Count -ne 5) {
          throw "Expected 5 packages, found $($packages.Count): $($packages.Name -join ', ')"
        }

    - name: Extract release notes
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"

        $version = $env:GITHUB_REF_NAME.Substring(1)
        $changelog = Get-Content CHANGELOG.md -Raw

        # Take the section "## [<version>] ..." up to the next top level heading; a missing section
        # must fail the job rather than ship a release without notes.
        $pattern = "(?ms)^## \[$([regex]::Escape($version))\][^\n]*\n(.*?)(?=^## |\z)"
        $match = [regex]::Match($changelog, $pattern)
        if (-not $match.Success) {
          throw "CHANGELOG.md has no section for version $version"
        }

        $footer = @'
        
        ---
        
        GPU packages need an NVIDIA GPU plus the CUDA Toolkit >= 13.0.1 (the Runtime component alone is enough) or any Vulkan-capable driver; the backend that actually ran is printed as a `Runtime:` line at startup. See the README for details.
        '@

        Set-Content -Path release-notes.md -Value ($match.Groups[1].Value.Trim() + "`n" + $footer) -Encoding utf8
        Write-Host "Release notes for $version:"
        Get-Content release-notes.md

    - name: Create Release
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $ErrorActionPreference = "Stop"

        # One release per tag, never deleted - this is what keeps every version's notes and
        # packages downloadable; GitHub flags the newest release as Latest automatically.
        gh release create "$env:GITHUB_REF_NAME" *.zip `
          --title "$env:GITHUB_REF_NAME" `
          --notes-file release-notes.md
